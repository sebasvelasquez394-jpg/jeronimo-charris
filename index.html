    <script>
      // Gracefully ignore benign WebSocket / Vite HMR transport errors in the sandbox iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 || msg.indexOf('@vite/client') !== -1) {
          event.preventDefault && event.preventDefault();
          event.stopPropagation && event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) ? String(event.reason.stack || event.reason.message || event.reason) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 || reason.indexOf('@vite/client') !== -1) {
          event.preventDefault && event.preventDefault();
          event.stopPropagation && event.stopPropagation();
          return true;
        }
      }, true);
    </script>
